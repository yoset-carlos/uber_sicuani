bind 127.0.0.1 ::1
protected-mode yes
port 6380
daemonize yes
dir /var/lib/redis-sicuani
pidfile /var/lib/redis-sicuani/redis.pid
logfile /var/lib/redis-sicuani/redis.log
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
maxmemory-policy noeviction
